<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="purpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1;filter:drop-shadow(0 0 10px #06b6d4)}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.node{animation:pulseNode 4s infinite ease-in-out;transform-box:fill-box;transform-origin:center}.node-delay1{animation-delay:1s}.node-delay2{animation-delay:2s}.connecting-line{stroke:#334155;stroke-width:2;stroke-dasharray:6 6;animation:dashMove 3s linear infinite}.active-line{stroke:url(#cyanGrad);stroke-width:2.5;stroke-dasharray:8 4;animation:dashMove 2s linear infinite}.floating-bg{animation:floatCard 6s ease-in-out infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g class="floating-bg" opacity=".4"><path stroke="#1e293b" stroke-width="1" d="M 100,0 V 320 M 200,0 V 320 M 300,0 V 320 M 400,0 V 320 M 500,0 V 320 M 600,0 V 320 M 700,0 V 320 M 800,0 V 320 M 900,0 V 320 M 1000,0 V 320 M 1100,0 V 320"/><path stroke="#1e293b" stroke-width="1" d="M 0,60 H 1200 M 0,120 H 1200 M 0,180 H 1200 M 0,240 H 1200 M 0,300 H 1200"/><path fill="none" d="M 900 80 L 1050 140 L 980 240 L 850 200 Z" class="connecting-line"/><path fill="none" d="M 1050 140 L 1120 220" class="active-line"/><circle cx="900" cy="80" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="3" class="node"/><circle cx="1050" cy="140" r="22" fill="#1e293b" stroke="#06b6d4" stroke-width="3" class="node node-delay1"/><circle cx="980" cy="240" r="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" class="node node-delay2"/><circle cx="850" cy="200" r="20" fill="#1e293b" stroke="#ec4899" stroke-width="3" class="node"/><circle cx="1120" cy="220" r="14" fill="#1e293b" stroke="#10b981" stroke-width="3" class="node node-delay1"/></g><g transform="translate(60, 0)"><rect width="280" height="32" x="0" y="52" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="16"/><circle cx="18" cy="68" r="5" fill="#10b981"/><text x="32" y="73" class="badge-text">HYBRID &amp; MULTI-CLOUD ECOSYSTEM</text><text x="0" y="135" class="title">Awesome Hybrid &amp; Multi-Cloud</text><text x="0" y="182" fill="url(#cyanGrad)" class="title">Management Platforms ☁️⚡</text><text x="0" y="232" class="subtitle">Unified Control Planes • Multi-Cluster K8s • Cross-Cloud Governance &amp; FinOps</text><rect width="480" height="4" x="0" y="270" fill="url(#purpleGrad)" rx="2"/></g></svg>