<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic Animated Node Pulsing */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #06b6d4); }
    }
    
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .node { animation: pulseNode 4s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    .node-delay1 { animation-delay: 1s; }
    .node-delay2 { animation-delay: 2s; }
    
    .connecting-line { stroke: #334155; stroke-width: 2; stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
    .active-line { stroke: url(#cyanGrad); stroke-width: 2.5; stroke-dasharray: 8 4; animation: dashMove 2s linear infinite; }
    
    .floating-bg { animation: floatCard 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic / Animated Background Graphics (Kept subtle & translucent in background) -->
  <g opacity="0.4" class="floating-bg">
    <!-- Grid pattern -->
    <path d="M 100,0 V 320 M 200,0 V 320 M 300,0 V 320 M 400,0 V 320 M 500,0 V 320 M 600,0 V 320 M 700,0 V 320 M 800,0 V 320 M 900,0 V 320 M 1000,0 V 320 M 1100,0 V 320" stroke="#1e293b" stroke-width="1"/>
    <path d="M 0,60 H 1200 M 0,120 H 1200 M 0,180 H 1200 M 0,240 H 1200 M 0,300 H 1200" stroke="#1e293b" stroke-width="1"/>

    <!-- Dynamic Topology Nodes (Background Layer) -->
    <path d="M 900 80 L 1050 140 L 980 240 L 850 200 Z" fill="none" class="connecting-line" />
    <path d="M 1050 140 L 1120 220" fill="none" class="active-line" />
    
    <!-- Cloud Nodes -->
    <circle cx="900" cy="80" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="3" class="node" />
    <circle cx="1050" cy="140" r="22" fill="#1e293b" stroke="#06b6d4" stroke-width="3" class="node node-delay1" />
    <circle cx="980" cy="240" r="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" class="node node-delay2" />
    <circle cx="850" cy="200" r="20" fill="#1e293b" stroke="#ec4899" stroke-width="3" class="node" />
    <circle cx="1120" cy="220" r="14" fill="#1e293b" stroke="#10b981" stroke-width="3" class="node node-delay1" />
  </g>

  <!-- Foreground Content Container (Ensures Title & Subtitle sit clearly above graphics) -->
  <g transform="translate(60, 0)">
    <!-- Pill Tag -->
    <rect x="0" y="52" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="18" cy="68" r="5" fill="#10b981" />
    <text x="32" y="73" class="badge-text">HYBRID &amp; MULTI-CLOUD ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Hybrid &amp; Multi-Cloud</text>
    <text x="0" y="182" class="title" fill="url(#cyanGrad)">Management Platforms ☁️⚡</text>

    <!-- Subtitle -->
    <text x="0" y="232" class="subtitle">Unified Control Planes • Multi-Cluster K8s • Cross-Cloud Governance &amp; FinOps</text>

    <!-- Bottom Decorative Bar -->
    <rect x="0" y="270" width="480" height="4" rx="2" fill="url(#purpleGrad)" />
  </g>
</svg>
